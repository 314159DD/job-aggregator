# Job Aggregator - Docker-based CRON
#
# Install: crontab cron.conf
# View:    crontab -l
# Edit:    crontab -e

AGGREGATOR_ENV=/opt/job-aggregator/.env
LOG=/var/log/aggregator.log
HEALTH_LOG=/var/log/aggregator-health.log

# ── Hourly: fetch jobs from all enabled sources ──
# Self-discovery runs automatically at the end of each aggregator pass
0 * * * * docker run --rm --env-file $AGGREGATOR_ENV job-aggregator >> $LOG 2>&1

# ── Manual trigger: touch /tmp/aggregator.trigger to run immediately ──
* * * * * [ -f /tmp/aggregator.trigger ] && rm -f /tmp/aggregator.trigger && docker run --rm --env-file $AGGREGATOR_ENV job-aggregator >> $LOG 2>&1

# ── Daily midnight: mark stale jobs inactive (not seen in 7 days) ──
0 0 * * * docker run --rm --env-file $AGGREGATOR_ENV job-aggregator python -m aggregator --freshness-check >> $LOG 2>&1

# ── Daily 00:30: health report (sources + ATS registry stats) ──
30 0 * * * docker run --rm --env-file $AGGREGATOR_ENV job-aggregator python -m aggregator --health-report >> $HEALTH_LOG 2>&1

# ── Weekly Sunday 02:00: full discovery (sitemap scan + self-discover) ──
0 2 * * 0 docker run --rm --env-file $AGGREGATOR_ENV job-aggregator python -m aggregator --discover >> $LOG 2>&1

# ── Weekly Sunday 03:00: skill snapshot (market demand aggregation) ──
0 3 * * 0 docker run --rm --env-file $AGGREGATOR_ENV job-aggregator python -m aggregator --skill-snapshot >> $LOG 2>&1

# ── Weekly Sunday 04:00: market snapshot (Career Radar data) ──
0 4 * * 0 docker run --rm --env-file $AGGREGATOR_ENV job-aggregator python -m aggregator --market-snapshot >> $LOG 2>&1
